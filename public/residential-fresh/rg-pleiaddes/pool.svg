<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="crystalWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="woodDeck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#twilightBg)" />

  <!-- Background Towers Silhouette -->
  <g fill="#0f172a" opacity="0.8">
    <rect x="80" y="40" width="160" height="360" rx="4" />
    <rect x="520" y="20" width="180" height="380" rx="4" />
    <rect x="960" y="50" width="170" height="350" rx="4" />
  </g>
  <!-- Illuminated Windows on Towers -->
  <g fill="#fef08a" opacity="0.4">
    <rect x="100" y="70" width="18" height="6" /><rect x="130" y="70" width="18" height="6" /><rect x="160" y="70" width="18" height="6" />
    <rect x="100" y="95" width="18" height="6" /><rect x="130" y="95" width="18" height="6" /><rect x="160" y="95" width="18" height="6" />
    <rect x="540" y="60" width="22" height="7" /><rect x="580" y="60" width="22" height="7" /><rect x="630" y="60" width="22" height="7" />
    <rect x="540" y="90" width="22" height="7" /><rect x="580" y="90" width="22" height="7" /><rect x="630" y="90" width="22" height="7" />
    <rect x="980" y="80" width="20" height="6" /><rect x="1020" y="80" width="20" height="6" /><rect x="1070" y="80" width="20" height="6" />
  </g>

  <!-- Feature Waterfall Cascade Wall -->
  <rect x="160" y="250" width="880" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Water Cascade Sheets -->
  <g fill="#bae6fd" opacity="0.85" filter="url(#softGlow)">
    <rect x="220" y="270" width="40" height="90" rx="2" />
    <rect x="340" y="270" width="40" height="90" rx="2" />
    <rect x="460" y="270" width="40" height="90" rx="2" />
    <rect x="580" y="270" width="40" height="90" rx="2" />
    <rect x="700" y="270" width="40" height="90" rx="2" />
    <rect x="820" y="270" width="40" height="90" rx="2" />
    <rect x="940" y="270" width="40" height="90" rx="2" />
  </g>

  <!-- Resort Swimming Pool Body -->
  <polygon points="60,675 180,360 1020,360 1140,675" fill="url(#crystalWater)" />
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.4" fill="none">
    <ellipse cx="600" cy="480" rx="420" ry="80" />
    <ellipse cx="600" cy="540" rx="460" ry="90" />
    <ellipse cx="600" cy="600" rx="500" ry="100" />
  </g>

  <!-- Wooden Deck & Loungers Foreground -->
  <polygon points="0,675 140,490 0,420" fill="url(#woodDeck)" />
  <polygon points="1200,675 1060,490 1200,420" fill="url(#woodDeck)" />

  <!-- Tropical Palm Trees & Planters -->
  <g fill="#065f46">
    <path d="M 120 440 Q 160 380 200 400 Q 150 420 120 440" />
    <path d="M 120 440 Q 90 370 140 370 Q 130 410 120 440" />
    <path d="M 1080 440 Q 1040 380 1000 400 Q 1050 420 1080 440" />
    <path d="M 1080 440 Q 1110 370 1060 370 Q 1070 410 1080 440" />
  </g>

  <!-- Warm Pathway Lanterns -->
  <g fill="#fef08a" filter="url(#softGlow)">
    <circle cx="160" cy="460" r="10" />
    <circle cx="1040" cy="460" r="10" />
    <circle cx="280" cy="380" r="8" />
    <circle cx="920" cy="380" r="8" />
  </g>

  <!-- Title Card Header -->
  <rect x="50" y="40" width="460" height="90" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#facc15" stroke-width="1.5" />
  <text x="75" y="75" fill="#fef08a" font-family="'Playfair Display', serif" font-size="22" font-weight="bold">
    An Ocean of Opulence &amp; Serenity
  </text>
  <text x="75" y="102" fill="#e2e8f0" font-family="sans-serif" font-size="13">
    Olympic-Length Lap Pool, Family Pool, Kids' Pool &amp; Indoor Pool
  </text>
</svg>
