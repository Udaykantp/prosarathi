<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="lobbyWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="40%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>
    <linearGradient id="flutedWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="marbleDesk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="chandelierGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Architecture Wall -->
  <rect width="1200" height="675" fill="url(#lobbyWall)" />

  <!-- Double Height Ceiling & Fluted Wood Paneling on Left -->
  <rect x="0" y="0" width="460" height="320" fill="#292524" />
  <!-- Vertical Acoustic Slats on Upper Wall -->
  <g stroke="#44403c" stroke-width="3">
    <line x1="20" y1="0" x2="20" y2="320" /><line x1="50" y1="0" x2="50" y2="320" /><line x1="80" y1="0" x2="80" y2="320" />
    <line x1="110" y1="0" x2="110" y2="320" /><line x1="140" y1="0" x2="140" y2="320" /><line x1="170" y1="0" x2="170" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" /><line x1="230" y1="0" x2="230" y2="320" /><line x1="260" y1="0" x2="260" y2="320" />
    <line x1="290" y1="0" x2="290" y2="320" /><line x1="320" y1="0" x2="320" y2="320" /><line x1="350" y1="0" x2="350" y2="320" />
    <line x1="380" y1="0" x2="380" y2="320" /><line x1="410" y1="0" x2="410" y2="320" /><line x1="440" y1="0" x2="440" y2="320" />
  </g>

  <!-- Iconic 3D Geometric White Sculptured Feature Wall on Right (Signature RG Feature) -->
  <rect x="490" y="90" width="710" height="585" fill="url(#flutedWall)" />
  <!-- 3D Geometric Grid Blocks -->
  <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5">
    <!-- Row 1 -->
    <rect x="510" y="110" width="38" height="60" rx="3" /><rect x="560" y="110" width="38" height="60" rx="3" /><rect x="610" y="110" width="38" height="60" rx="3" />
    <rect x="660" y="110" width="38" height="60" rx="3" /><rect x="710" y="110" width="38" height="60" rx="3" /><rect x="760" y="110" width="38" height="60" rx="3" />
    <rect x="810" y="110" width="38" height="60" rx="3" /><rect x="860" y="110" width="38" height="60" rx="3" /><rect x="910" y="110" width="38" height="60" rx="3" />
    <rect x="960" y="110" width="38" height="60" rx="3" /><rect x="1010" y="110" width="38" height="60" rx="3" /><rect x="1060" y="110" width="38" height="60" rx="3" />
    <!-- Row 2 -->
    <rect x="510" y="180" width="38" height="60" rx="3" /><rect x="560" y="180" width="38" height="60" rx="3" /><rect x="610" y="180" width="38" height="60" rx="3" />
    <rect x="660" y="180" width="38" height="60" rx="3" /><rect x="710" y="180" width="38" height="60" rx="3" /><rect x="760" y="180" width="38" height="60" rx="3" />
    <rect x="810" y="180" width="38" height="60" rx="3" /><rect x="860" y="180" width="38" height="60" rx="3" /><rect x="910" y="180" width="38" height="60" rx="3" />
    <rect x="960" y="180" width="38" height="60" rx="3" /><rect x="1010" y="180" width="38" height="60" rx="3" /><rect x="1060" y="180" width="38" height="60" rx="3" />
    <!-- Row 3 -->
    <rect x="510" y="250" width="38" height="60" rx="3" /><rect x="560" y="250" width="38" height="60" rx="3" /><rect x="610" y="250" width="38" height="60" rx="3" />
    <rect x="660" y="250" width="38" height="60" rx="3" /><rect x="710" y="250" width="38" height="60" rx="3" /><rect x="760" y="250" width="38" height="60" rx="3" />
    <rect x="810" y="250" width="38" height="60" rx="3" /><rect x="860" y="250" width="38" height="60" rx="3" /><rect x="910" y="250" width="38" height="60" rx="3" />
    <!-- Row 4 -->
    <rect x="510" y="320" width="38" height="60" rx="3" /><rect x="560" y="320" width="38" height="60" rx="3" /><rect x="610" y="320" width="38" height="60" rx="3" />
    <rect x="660" y="320" width="38" height="60" rx="3" /><rect x="710" y="320" width="38" height="60" rx="3" /><rect x="760" y="320" width="38" height="60" rx="3" />
  </g>

  <!-- Designer Star Chandelier on Wall -->
  <g transform="translate(680, 240)" filter="url(#chandelierGlow)">
    <circle cx="0" cy="0" r="16" fill="#fef08a" />
    <line x1="-50" y1="-20" x2="50" y2="20" stroke="#facc15" stroke-width="3" />
    <line x1="-30" y1="40" x2="30" y2="-40" stroke="#facc15" stroke-width="3" />
    <circle cx="-50" cy="-20" r="8" fill="#ffffff" />
    <circle cx="50" cy="20" r="8" fill="#ffffff" />
    <circle cx="-30" cy="40" r="8" fill="#ffffff" />
    <circle cx="30" cy="-40" r="8" fill="#ffffff" />
  </g>

  <!-- Polished Italian Black Marble Floor with High Gloss Reflections -->
  <polygon points="0,675 0,440 1200,440 1200,675" fill="#09090b" />
  <!-- Gloss Sheen Lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.15">
    <line x1="0" y1="470" x2="1200" y2="540" />
    <line x1="0" y1="530" x2="1200" y2="600" />
    <line x1="0" y1="600" x2="1200" y2="670" />
  </g>

  <!-- Curved Luxury Marble Reception Counter -->
  <g>
    <path d="M 520 480 Q 720 450 880 480 L 880 620 Q 720 590 520 620 Z" fill="url(#marbleDesk)" stroke="#facc15" stroke-width="2.5" />
    <!-- Desk Top Lip -->
    <ellipse cx="700" cy="480" rx="180" ry="24" fill="#64748b" stroke="#fef08a" stroke-width="2" />
    <!-- Gold Trim Vertical Slit -->
    <line x1="560" y1="480" x2="560" y2="620" stroke="url(#goldAccent)" stroke-width="4" />
  </g>

  <!-- Executive Lounge Armchairs (Left) -->
  <g fill="#ea580c" stroke="#c2410c" stroke-width="2">
    <ellipse cx="140" cy="550" rx="45" ry="35" />
    <path d="M 95 550 Q 140 480 185 550 Z" />
    <ellipse cx="280" cy="540" rx="45" ry="35" fill="#d97706" />
    <path d="M 235 540 Q 280 470 325 540 Z" />
  </g>
  <!-- Coffee Table with Gold Legs -->
  <ellipse cx="210" cy="580" rx="35" ry="16" fill="#18181b" stroke="#facc15" stroke-width="2" />

  <!-- Tropical Planters / Fiddle Leaf Fig on Right -->
  <g fill="#14532d">
    <ellipse cx="1060" cy="480" rx="40" ry="25" />
    <ellipse cx="1080" cy="430" rx="45" ry="25" />
    <ellipse cx="1030" cy="410" rx="35" ry="20" />
    <ellipse cx="1060" cy="360" rx="40" ry="22" />
    <!-- Pot -->
    <polygon points="1020,530 1100,530 1080,630 1040,630" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- Title Badge -->
  <rect x="50" y="40" width="460" height="90" rx="12" fill="#09090b" fill-opacity="0.9" stroke="#facc15" stroke-width="1.5" />
  <text x="75" y="75" fill="#fef08a" font-family="'Playfair Display', serif" font-size="22" font-weight="bold">
    For a Star-Struck Arrival
  </text>
  <text x="75" y="102" fill="#cbd5e1" font-family="sans-serif" font-size="13">
    Double-Height Air Conditioned Tower Lobby &amp; Concierge Lounge
  </text>
</svg>
