<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="amenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#amenBg)" />

  <!-- Header -->
  <rect x="50" y="30" width="1100" height="80" rx="12" fill="#1e293b" stroke="#facc15" stroke-width="1.5" />
  <text x="600" y="65" fill="#fef08a" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" text-anchor="middle">
    Club Astero — 7-Star Curated Lifestyle &amp; Wellness
  </text>
  <text x="600" y="92" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">
    Designed for Elevated Leisure, Fitness, Dining &amp; Family Entertainment
  </text>

  <!-- 6 Feature Highlight Tiles -->
  <!-- 1. Matrix Gym -->
  <g transform="translate(60, 140)">
    <rect width="340" height="230" rx="12" fill="#111827" stroke="#374151" stroke-width="2" />
    <rect x="0" y="0" width="340" height="150" rx="12" fill="#1f2937" />
    <circle cx="170" cy="75" r="45" fill="#374151" stroke="#facc15" stroke-width="2" />
    <text x="170" y="86" fill="#facc15" font-size="36" text-anchor="middle">🏋️</text>
    <text x="170" y="180" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle" font-family="sans-serif">High-Tech Matrix Gym</text>
    <text x="170" y="205" fill="#9ca3af" font-size="12" text-anchor="middle" font-family="sans-serif">World-class cardio, strength &amp; trainer zone</text>
  </g>

  <!-- 2. Celestial Indoor & Lap Pool -->
  <g transform="translate(430, 140)">
    <rect width="340" height="230" rx="12" fill="#111827" stroke="#0284c7" stroke-width="2" />
    <rect x="0" y="0" width="340" height="150" rx="12" fill="#0c4a6e" />
    <circle cx="170" cy="75" r="45" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <text x="170" y="86" fill="#38bdf8" font-size="36" text-anchor="middle">🏊</text>
    <text x="170" y="180" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle" font-family="sans-serif">Celestial Indoor &amp; Lap Pool</text>
    <text x="170" y="205" fill="#9ca3af" font-size="12" text-anchor="middle" font-family="sans-serif">Temperature-controlled with star-lit ceiling</text>
  </g>

  <!-- 3. Bowling Alley &amp; Games -->
  <g transform="translate(800, 140)">
    <rect width="340" height="230" rx="12" fill="#111827" stroke="#374151" stroke-width="2" />
    <rect x="0" y="0" width="340" height="150" rx="12" fill="#1f2937" />
    <circle cx="170" cy="75" r="45" fill="#374151" stroke="#facc15" stroke-width="2" />
    <text x="170" y="86" fill="#facc15" font-size="36" text-anchor="middle">🎳</text>
    <text x="170" y="180" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle" font-family="sans-serif">Professional Bowling Alley</text>
    <text x="170" y="205" fill="#9ca3af" font-size="12" text-anchor="middle" font-family="sans-serif">Multi-lane bowling, carrom &amp; indoor sports</text>
  </g>

  <!-- 4. Fine Dining &amp; Restaurant -->
  <g transform="translate(60, 400)">
    <rect width="340" height="230" rx="12" fill="#111827" stroke="#374151" stroke-width="2" />
    <rect x="0" y="0" width="340" height="150" rx="12" fill="#1f2937" />
    <circle cx="170" cy="75" r="45" fill="#374151" stroke="#facc15" stroke-width="2" />
    <text x="170" y="86" fill="#facc15" font-size="36" text-anchor="middle">🍽️</text>
    <text x="170" y="180" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle" font-family="sans-serif">Taste the Universe Restaurant</text>
    <text x="170" y="205" fill="#9ca3af" font-size="12" text-anchor="middle" font-family="sans-serif">Gourmet fine dining &amp; poolside cafe</text>
  </g>

  <!-- 5. Ayurvedic Spa &amp; Massage Room -->
  <g transform="translate(430, 400)">
    <rect width="340" height="230" rx="12" fill="#111827" stroke="#374151" stroke-width="2" />
    <rect x="0" y="0" width="340" height="150" rx="12" fill="#1f2937" />
    <circle cx="170" cy="75" r="45" fill="#374151" stroke="#facc15" stroke-width="2" />
    <text x="170" y="86" fill="#facc15" font-size="36" text-anchor="middle">💆</text>
    <text x="170" y="180" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle" font-family="sans-serif">Spa &amp; Cosmic Massage Suites</text>
    <text x="170" y="205" fill="#9ca3af" font-size="12" text-anchor="middle" font-family="sans-serif">Therapeutic rejuvenation with steam &amp; sauna</text>
  </g>

  <!-- 6. Sports Courts &amp; Amphitheatre -->
  <g transform="translate(800, 400)">
    <rect width="340" height="230" rx="12" fill="#111827" stroke="#16a34a" stroke-width="2" />
    <rect x="0" y="0" width="340" height="150" rx="12" fill="#064e3b" />
    <circle cx="170" cy="75" r="45" fill="#047857" stroke="#4ade80" stroke-width="2" />
    <text x="170" y="86" fill="#4ade80" font-size="36" text-anchor="middle">🎾</text>
    <text x="170" y="180" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle" font-family="sans-serif">Tennis, Cricket &amp; Amphitheatre</text>
    <text x="170" y="205" fill="#9ca3af" font-size="12" text-anchor="middle" font-family="sans-serif">Full tennis court, cricket pitch &amp; cultural lawn</text>
  </g>
</svg>
